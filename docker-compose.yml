services:
  backend:
    build: ./backend
    container_name: save-the-animals-backend
    environment:
      APP_DB_PATH: /data/app.db
    volumes:
      - sqlite-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: save-the-animals-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        # nginx resolves the backend lazily, but waiting avoids a confusing 502 on first load.
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite-data:
