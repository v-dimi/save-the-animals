server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Required because every upstream below is referenced through a
    # variable, which makes nginx resolve it per request instead of once at startup — so a
    # backend restart or a third-party DNS change does not need an nginx reload.
    resolver 127.0.0.11 ipv6=off valid=30s;

    root /usr/share/nginx/html;
    index index.html;

    # Allow for larger images
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- The API and the health endpoint -------------------------------------
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        set $backend http://backend:8080;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/animals/cat/(?<cat_path>.*)$ {
        set $cat_service https://placecats.com;
        proxy_pass $cat_service/$cat_path$is_args$args;
        proxy_set_header Host placecats.com;
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        proxy_http_version 1.1;
    }

    location ~ ^/animals/dog/(?<dog_path>.*)$ {
        set $dog_service https://place.dog;
        proxy_pass $dog_service/$dog_path$is_args$args;
        proxy_set_header Host place.dog;
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        proxy_http_version 1.1;
    }

    location ~ ^/animals/bear/(?<bear_path>.*)$ {
        set $bear_service https://placebear.com;
        proxy_pass $bear_service/$bear_path$is_args$args;
        proxy_set_header Host placebear.com;
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        proxy_http_version 1.1;
    }
}
